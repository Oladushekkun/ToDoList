<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мои задачи</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1 class="header__title">Мои задачи</h1>

        <p class="header__description">Планируйте. Делайте. Отмечайте.</p>
      </header>

      <form class="task-form" id="taskForm">
        <div class="task-form__fields">
          <div class="task-form__group">
            <label class="task-form__label" for="task-form__input-name">
              Название*
            </label>

            <input
              class="task-form__input"
              type="text"
              id="task-form__input-name"
              name="taskName"
              placeholder="Например, сверстать форму"
            />
          </div>

          <div class="task-form__group">
            <label class="task-form__label" for="task-form__input-description">
              Описание
              <span class="task-form__description-note">· необязательно</span>
            </label>

            <textarea
              class="task-form__textarea"
              id="task-form__input-description"
              name="description"
              placeholder="Что нужно сделать?"
            ></textarea>
          </div>

          <div class="task-form__group">
            <label class="task-form__label" for="task-form__select">
              Приоритет
            </label>

            <select
              id="task-form__select"
              class="task-form__select"
              name="priority"
            >
              <option class="task-form__option">Низкий</option>
              <option class="task-form__option">Средний</option>
              <option class="task-form__option">Высокий</option>
            </select>
          </div>
        </div>

        <div class="task-form__footer">
          <p class="task-form__footer-note">*Обязательное поле</p>

          <button class="task-form__button">Добавить</button>
        </div>
      </form>

      <section class="task-list__section">
        <div class="task-list__container-header" id="listHeader">
          <h2 class="task-list__title">Список задач</h2>
        </div>

        <div class="task-list" id="taskList"></div>
      </section>
    </div>
    <script src="main.js"></script>
  </body>
</html>
